name: Bump upstream version

on:
  schedule:
    - cron: "00 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - "main"

jobs:
  bump-upstream:
    uses: dappnode/workflows/.github/workflows/bump-upstream.yml@master
    with:
      upstream_repo: "supabase/postgres"
      tag_pattern: "^v?([0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+)(?:-cli)?$"
    secrets: inherit
